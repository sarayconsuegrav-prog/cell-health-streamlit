# BoT-SORT para cámara en vivo: compensa el movimiento de la cámara y conserva
# brevemente las identidades cuando una máscara desaparece por una inferencia.
tracker_type: botsort
track_high_thresh: 0.35
track_low_thresh: 0.1
new_track_thresh: 0.35
track_buffer: 60
match_thresh: 0.8
fuse_score: True

# La placa/cámara se mueve durante la inspección. No habilitar ReID por ahora:
# las células son visualmente parecidas y extraer embeddings aumentaría la carga.
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
